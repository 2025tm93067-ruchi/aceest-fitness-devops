apiVersion: v1
kind: Service
metadata:
  name: aceest-stable
  namespace: aceest-lab
spec:
  selector: {app: aceest, track: stable}
  ports: [{port: 5000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-candidate
  namespace: aceest-lab
spec:
  selector: {app: aceest, track: candidate}
  ports: [{port: 5000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling
  namespace: aceest-lab
spec:
  selector: {app: aceest, track: rolling}
  ports: [{port: 5000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bluegreen
  namespace: aceest-lab
spec:
  selector: {app: aceest, track: bluegreen, slot: blue}
  ports: [{port: 5000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-entry
  namespace: aceest-lab
spec:
  type: NodePort
  selector: {app: aceest-entry}
  ports: [{name: http, port: 80, targetPort: http, nodePort: 30080}]
