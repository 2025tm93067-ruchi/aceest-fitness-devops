apiVersion: apps/v1
kind: Deployment
metadata: {name: aceest-rolling, namespace: aceest-lab}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: aceest, track: rolling}}
  template:
    metadata: {labels: {app: aceest, track: rolling}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: app
          image: STABLE_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 5000}]
          env: [{name: DATABASE, value: /tmp/aceest.db}, {name: PYTHONUNBUFFERED, value: "1"}]
          resources: {requests: {cpu: 25m, memory: 48Mi}, limits: {cpu: 250m, memory: 160Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /version, port: http}, initialDelaySeconds: 3, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /version, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
