# Render image placeholders with scripts/bootstrap-k8s.sh before applying.
# SQLite is deliberately local and ephemeral: use only GET /version for this lab.
apiVersion: apps/v1
kind: Deployment
metadata: {name: aceest-stable, namespace: aceest-lab}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: {matchLabels: {app: aceest, track: stable}}
  template:
    metadata: {labels: {app: aceest, track: stable}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: app
          image: STABLE_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 5000}]
          env: [{name: DATABASE, value: /tmp/aceest.db}, {name: PYTHONUNBUFFERED, value: "1"}]
          resources: {requests: {cpu: 25m, memory: 48Mi}, limits: {cpu: 250m, memory: 160Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /version, port: http}, initialDelaySeconds: 3, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /version, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
---
