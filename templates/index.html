<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACEest Fitness &amp; Gym</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f4f6f8;color:#17212b;margin:0}
    main{max-width:1000px;margin:32px auto;padding:24px}h1{color:#173e36}
    section{background:white;padding:24px;border-radius:10px;margin:20px 0}
    form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
    label{display:grid;gap:6px}input,select,button{font:inherit;padding:10px}
    button{background:#173e36;color:white;border:0;border-radius:5px;cursor:pointer}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #ddd}
    .scroll{overflow:auto}#message{min-height:24px}small{color:#52606d}
  </style>
</head>
<body><main>
  <h1>ACEest Fitness &amp; Gym</h1>
  <p>Client registration, fitness programs and weekly adherence tracking.</p>
  <section><h2>Register a client</h2>
    <form id="client-form">
      <label>Name<input name="name" required maxlength="100"></label>
      <label>Age<input name="age" type="number" min="1" max="120" required></label>
      <label>Weight in kg<input name="weight" type="number" min="0.1" step="0.1" required></label>
      <label>Program<select name="program">{% for name in programs %}<option>{{ name }}</option>{% endfor %}</select></label>
      <button type="submit">Save client</button>
    </form>
    <p><small>Calorie estimates reproduce the assignment's sample calculation.</small></p>
  </section>
  <section><h2>Clients</h2><div class="scroll"><table>
    <thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Weight</th><th>Program</th><th>Calories</th></tr></thead>
    <tbody id="clients"></tbody>
  </table></div></section>
  <section><h2>Weekly progress</h2>
    <form id="progress-form">
      <label>Client ID<input name="client_id" type="number" min="1" required></label>
      <label>Week date<input name="week" type="date" required></label>
      <label>Adherence percent<input name="adherence" type="number" min="0" max="100" required></label>
      <button type="submit">Save progress</button>
    </form>
    <button id="history" type="button" style="margin-top:16px">View progress for entered client ID</button>
    <pre id="progress"></pre>
  </section>
  <p id="message" role="status" aria-live="polite"></p>
</main>
<script>
  const message=document.querySelector('#message');
  async function api(url, body){
    const response=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error || 'Request failed');
    return data;
  }
  async function refresh(){
    const rows=await api('/clients');
    const target=document.querySelector('#clients');target.replaceChildren();
    rows.forEach(row=>{const tr=document.createElement('tr');
      ['id','name','age','weight','program','calories'].forEach(key=>{const td=document.createElement('td');td.textContent=row[key];tr.append(td)});target.append(tr)});
  }
  document.querySelector('#client-form').addEventListener('submit',async event=>{
    event.preventDefault();const f=new FormData(event.target);
    try{const data=await api('/clients',{name:f.get('name'),age:Number(f.get('age')),weight:Number(f.get('weight')),program:f.get('program')});
      message.textContent=`Client ${data.id} saved. Estimated calories: ${data.calories}`;await refresh();
    }catch(error){message.textContent=error.message}
  });
  document.querySelector('#progress-form').addEventListener('submit',async event=>{
    event.preventDefault();const f=new FormData(event.target);
    try{await api(`/clients/${Number(f.get('client_id'))}/progress`,{week:f.get('week'),adherence:Number(f.get('adherence'))});message.textContent='Progress saved';}
    catch(error){message.textContent=error.message}
  });
  document.querySelector('#history').addEventListener('click',async()=>{
    const id=document.querySelector('[name="client_id"]').value;
    if(!id){message.textContent='Enter a client ID first';return;}
    try{document.querySelector('#progress').textContent=JSON.stringify(await api(`/clients/${id}/progress`),null,2)}
    catch(error){message.textContent=error.message}
  });
  refresh().catch(error=>message.textContent=error.message);
</script></body></html>
